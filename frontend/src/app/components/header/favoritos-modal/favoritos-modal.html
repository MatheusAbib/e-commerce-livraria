<div class="custom-modal" [class.active]="visible">
  <div class="custom-modal-overlay" (click)="fechar()"></div>
  <div class="custom-modal-content" style="width: 600px; max-width: 95%; max-height: 85vh;">
    <button class="custom-modal-close" (click)="fechar()">
      <i class="pi pi-times"></i>
    </button>

    <div class="custom-modal-header">
      <div class="auth-icon">
        <i class="pi pi-heart"></i>
      </div>
      <h2>Meus Favoritos</h2>
      <p>Seus livros favoritos salvos</p>
    </div>

    <div class="custom-modal-body" style="position: relative; min-height: 200px; max-height: 60vh; overflow-y: auto;">
      <div *ngIf="loading" class="loader-overlay">
        <div class="loader-container">
          <div class="loader-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
          </div>
          <p class="loader-text">Carregando favoritos...</p>
        </div>
      </div>

      <div *ngIf="!loading">
        <div *ngIf="favoritos.length === 0" class="empty-state">
          <i class="pi pi-heart" style="font-size: 3rem; color: #cbd5e1;"></i>
          <h3>Nenhum favorito</h3>
          <p>Você ainda não adicionou livros aos favoritos</p>
        </div>

        <div *ngIf="favoritos.length > 0" class="favoritos-grid">
          <div *ngFor="let livro of favoritos" class="favorito-card" [class.card-problema]="!livro.ativo || livro.estoque <= 0">
            <img [src]="livro.imagemUrl ? '/uploads/' + livro.imagemUrl : 'https://via.placeholder.com/60x80?text=Sem+Imagem'" [alt]="livro.titulo">
            <div class="favorito-info">
              <div class="favorito-titulo">
                <h4>{{livro.titulo}}</h4>
                <span *ngIf="!livro.ativo" class="status-inativo-fav">INATIVO</span>
                <span *ngIf="livro.ativo && livro.estoque <= 0" class="status-esgotado-fav">ESGOTADO</span>
              </div>
              <p>{{livro.autor || 'Autor desconhecido'}}</p>
              <span class="favorito-preco">R$ {{livro.precoVenda || 0 | number:'1.2-2'}}</span>
            </div>
            <div class="favorito-actions">
              <button class="btn-ver" style="justify-content: center; border-radius: 100%; height: 32px; width: 32px;" (click)="verDetalhes(livro.id)" title="Ver detalhes">
                <i class="pi pi-eye"></i>
              </button>
              <button class="btn-favorito-remover" (click)="removerFavorito(livro.id)" title="Remover dos favoritos" [disabled]="carregandoRemover[livro.id]" [class.loading]="carregandoRemover[livro.id]">
                <i class="pi pi-heart-fill" style="color: #dc2626;"></i>
              </button>
              <button class="btn-carrinho" (click)="adicionarAoCarrinho(livro.id)" title="Adicionar ao carrinho" [disabled]="!livro.ativo || livro.estoque <= 0 || carregandoCarrinho[livro.id]" [class.loading]="carregandoCarrinho[livro.id]">
                <i class="pi pi-cart-plus"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="custom-modal-footer">
      <button class="btn-secondary" (click)="fechar()">
        <i class="pi pi-times"></i> Fechar
      </button>
    </div>
  </div>
</div>

<p-toast position="top-right"></p-toast>
